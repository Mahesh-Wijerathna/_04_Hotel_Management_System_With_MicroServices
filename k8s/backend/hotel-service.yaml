apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotel-service
  template:
    metadata:
      labels:
        app: hotel-service
    spec:
      containers:
        - name: hotel-service
          image: hotel-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8002
          env:
            - name: DATABASE_URL
              value: mysql+pymysql://hotel_user:hotelpass@hotel-mysql:3306/hotel_db
            - name: JWT_SECRET_KEY
              value: your_secret
            - name: JWT_ALGORITHM
              value: HS256
            - name: CORS_ORIGINS
              value: "*"
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-service
spec:
  selector:
    app: hotel-service
  ports:
    - port: 8002
      targetPort: 8002
