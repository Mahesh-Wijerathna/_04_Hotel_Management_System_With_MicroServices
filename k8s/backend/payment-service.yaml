apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: payment-service:latest
          ports:
            - containerPort: 8001
          env:
            - name: DATABASE_URL
              value: mysql://payment_user:paymentpass@payment-mysql:3306/payment_db
            - name: JWT_SECRET_KEY
              value: your_secret
            - name: JWT_ALGORITHM
              value: HS256
            - name: CORS_ORIGINS
              value: "*"
            - name: BOOKING_SERVICE_URL
              value: http://booking-service:8001
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  selector:
    app: payment-service
  ports:
    - port: 8001
      targetPort: 8001
