apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
        - name: booking-service
          image: booking-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8003
          env:
            - name: DATABASE_URL
              value: mysql+pymysql://booking_user:bookingpass@booking-mysql:3306/booking_db
            - name: JWT_SECRET_KEY
              value: your_secret
            - name: JWT_ALGORITHM
              value: HS256
            - name: CORS_ORIGINS
              value: "*"
            - name: HOTEL_SERVICE_BASE_URL
              value: http://hotel-service:8002
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
spec:
  selector:
    app: booking-service
  ports:
    - port: 8003
      targetPort: 8003
