---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-mysql-init
data:
  init.sql: |
    -- Idempotent schema init for auth service (MySQL)
    -- Will run only on first MySQL initialization of the data directory

    -- Ensure database exists (must match .env MYSQL_DATABASE)
    CREATE DATABASE IF NOT EXISTS `auth_db`;
    USE `auth_db`;

    CREATE TABLE IF NOT EXISTS `users` (
      `id` INT AUTO_INCREMENT PRIMARY KEY,
      `email` VARCHAR(255) NOT NULL UNIQUE,
      `hashed_password` VARCHAR(255) NOT NULL,
      `role` ENUM('customer','staff') NOT NULL DEFAULT 'customer',
      `full_name` VARCHAR(255) NULL,
      `created_at` DATETIME DEFAULT CURRENT_TIMESTAMP,
      `updated_at` DATETIME DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-mysql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-mysql-secret
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: rootpassword
  MYSQL_DATABASE: auth_db
  MYSQL_USER: auth_user
  MYSQL_PASSWORD: authpass
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-mysql
  template:
    metadata:
      labels:
        app: auth-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: auth-mysql-secret
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: mysql-storage
            - mountPath: /docker-entrypoint-initdb.d
              name: mysql-init
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: auth-mysql-pvc
        - name: mysql-init
          configMap:
            name: auth-mysql-init
---
apiVersion: v1
kind: Service
metadata:
  name: auth-mysql
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: auth-mysql
