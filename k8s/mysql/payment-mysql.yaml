---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-mysql-init
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS `payment_db`;
    USE `payment_db`;

    CREATE TABLE IF NOT EXISTS `payments` (
      `id` INT AUTO_INCREMENT PRIMARY KEY,
      `booking_id` INT NOT NULL,
      `user_id` INT NOT NULL,
      `amount` DECIMAL(10,2) NOT NULL,
      `currency` CHAR(3) NOT NULL DEFAULT 'USD',
      `method` VARCHAR(32) NOT NULL DEFAULT 'card',
      `status` ENUM('pending','succeeded','failed','refunded') NOT NULL DEFAULT 'succeeded',
      `provider` VARCHAR(32) NULL,
      `provider_payment_id` VARCHAR(128) NULL,
      `idempotency_key` VARCHAR(64) NOT NULL,
      `error_code` VARCHAR(64) NULL,
      `error_message` VARCHAR(255) NULL,
      `created_at` DATETIME DEFAULT CURRENT_TIMESTAMP,
      `updated_at` DATETIME DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
      UNIQUE KEY `ux_idempotency_key` (`idempotency_key`),
      KEY `ix_booking_id` (`booking_id`),
      KEY `ix_user_id` (`user_id`),
      KEY `ix_status` (`status`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: payment-mysql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-mysql-secret
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: rootpassword
  MYSQL_DATABASE: payment_db
  MYSQL_USER: payment_user
  MYSQL_PASSWORD: paymentpass
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-mysql
  template:
    metadata:
      labels:
        app: payment-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: payment-mysql-secret
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: mysql-storage
            - mountPath: /docker-entrypoint-initdb.d
              name: mysql-init
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: payment-mysql-pvc
        - name: mysql-init
          configMap:
            name: payment-mysql-init
---
apiVersion: v1
kind: Service
metadata:
  name: payment-mysql
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: payment-mysql
