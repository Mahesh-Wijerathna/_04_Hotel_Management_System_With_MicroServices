apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: payment-mysql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-mysql-secret
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: rootpassword
  MYSQL_DATABASE: auth_db
  MYSQL_USER: auth_user
  MYSQL_PASSWORD: authpass
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-mysql
  template:
    metadata:
      labels:
        app: payment-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: payment-mysql-secret
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: mysql-storage
            - mountPath: /docker-entrypoint-initdb.d
              name: initdb
              readOnly: true
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: payment-mysql-pvc
        - name: initdb
          hostPath:
            path: ./payment-service/db
---
apiVersion: v1
kind: Service
metadata:
  name: payment-mysql
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: payment-mysql
