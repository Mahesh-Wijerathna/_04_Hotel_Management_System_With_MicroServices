---
apiVersion: v1
kind: ConfigMap
metadata:
  name: booking-mysql-init
data:
  init.sql: |
    -- Idempotent schema for booking-service
    CREATE DATABASE IF NOT EXISTS `booking_db` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    USE `booking_db`;

    CREATE TABLE IF NOT EXISTS `bookings` (
      `id` INT AUTO_INCREMENT PRIMARY KEY,
      `user_id` INT NOT NULL,
      `service_id` INT NOT NULL,
      `quantity` INT NOT NULL DEFAULT 1,
      `unit_price` DECIMAL(10,2) NOT NULL,
      `total_price` DECIMAL(10,2) NOT NULL,
      `currency` CHAR(3) NOT NULL DEFAULT 'USD',
      `scheduled_for` DATETIME NULL,
      `status` ENUM('pending','confirmed','canceled') NOT NULL DEFAULT 'pending',
      `created_at` DATETIME DEFAULT CURRENT_TIMESTAMP,
      `updated_at` DATETIME DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
      INDEX `ix_user_id` (`user_id`),
      INDEX `ix_service_id` (`service_id`),
      INDEX `ix_status` (`status`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: booking-mysql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: booking-mysql-secret
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: rootpassword
  MYSQL_DATABASE: booking_db
  MYSQL_USER: booking_user
  MYSQL_PASSWORD: bookingpass
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-mysql
  template:
    metadata:
      labels:
        app: booking-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: booking-mysql-secret
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: mysql-storage
            - mountPath: /docker-entrypoint-initdb.d
              name: mysql-init
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: booking-mysql-pvc
        - name: mysql-init
          configMap:
            name: booking-mysql-init
---
apiVersion: v1
kind: Service
metadata:
  name: booking-mysql
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: booking-mysql
